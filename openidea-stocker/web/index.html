<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Title bar: "Stocker" + market tabs + close (matches the IntelliJ tool window content tabs) -->
  <div id="titlebar" class="titlebar">
    <div class="tw-title"><span class="tw-icon"></span><span>Stocker</span></div>
    <div id="tabs" class="tabs">
      <button class="tab active" data-market="all">ALL</button>
      <button class="tab" data-market="cn">CN</button>
      <button class="tab" data-market="hk">HK</button>
      <button class="tab" data-market="us">US</button>
      <button class="tab" data-market="crypto">Crypto</button>
    </div>
    <button id="btn-close" class="tw-close" title="隐藏">&#10005;</button>
  </div>

  <!-- Toolbar: left actions + right settings, like StockerSimpleToolWindow -->
  <div id="toolbar" class="toolbar">
    <div class="toolbar-left">
      <button id="btn-add" class="tb-btn" title="添加自选">&#43;</button>
      <button id="btn-refresh" class="tb-btn" title="刷新行情">&#8635;</button>
      <button id="btn-stop" class="tb-btn stop" title="停止刷新">&#9632;</button>
      <button id="btn-manage" class="tb-btn" title="管理自选">&#9998;</button>
    </div>
    <div class="toolbar-right">
      <button id="btn-settings" class="tb-btn" title="设置">&#9881;</button>
    </div>
  </div>

  <!-- Table -->
  <div id="table-wrap" class="table-wrap">
    <table id="quotes">
      <thead><tr id="head-row"></tr></thead>
      <tbody id="body-row"></tbody>
    </table>
    <div id="empty" class="empty">暂无自选，点击 + 添加自选代码</div>
  </div>

  <!-- Index bar: one selected index + value + change + percent -->
  <div id="index-bar" class="index-bar">
    <select id="index-select" class="index-select"></select>
    <span id="idx-value" class="idx-cell"></span>
    <span id="idx-extent" class="idx-cell"></span>
    <span id="idx-percent" class="idx-cell"></span>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-menu" class="ctx-menu hidden"><div id="ctx-delete" class="ctx-item">删除</div></div>

<!-- Add Favorites dialog -->
<div id="search-dialog" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">添加自选</div>
    <div class="search-top">
      <div class="mode-row"><label>搜索类型：</label>
        <select id="search-mode">
          <option value="stocks">股票（A股/港股/美股）</option>
          <option value="crypto">加密货币</option>
        </select>
      </div>
      <input id="search-input" type="text" placeholder="输入以搜索股票（A股/港股/美股）" autocomplete="off">
      <div class="search-header">
        <span class="col-code">代码</span><span class="col-market">市场</span>
        <span class="col-name">名称</span><span class="col-action">操作</span>
      </div>
    </div>
    <div id="search-results" class="search-results"></div>
    <div class="modal-footer"><button id="search-close" class="btn">关闭</button></div>
  </div>
</div>

<!-- Manage Favorites dialog -->
<div id="manage-dialog" class="modal hidden">
  <div class="modal-box large">
    <div class="modal-title">管理自选</div>
    <div id="manage-tabs" class="manage-tabs">
      <button class="mtab active" data-market="cn">CN</button>
      <button class="mtab" data-market="hk">HK</button>
      <button class="mtab" data-market="us">US</button>
      <button class="mtab" data-market="crypto">Crypto</button>
    </div>
    <div class="manage-header">
      <span class="m-code">代码</span><span class="m-name">原始名称</span>
      <span class="m-custom">自定义名称</span><span class="m-cost">成本</span>
      <span class="m-hold">持仓</span><span class="m-ops"></span>
    </div>
    <div id="manage-list" class="manage-list"></div>
    <div class="modal-footer">
      <button id="manage-ok" class="btn primary">确定</button>
      <button id="manage-cancel" class="btn">取消</button>
    </div>
  </div>
</div>

<!-- Edit dialog -->
<div id="edit-dialog" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-title" id="edit-title">编辑</div>
    <div class="edit-fields">
      <label>自定义名称：<input id="edit-name" type="text"></label>
      <label>成本价：<input id="edit-cost" type="text"></label>
      <label>持仓：<input id="edit-holdings" type="text"></label>
      <div id="edit-error" class="field-error"></div>
    </div>
    <div class="modal-footer">
      <button id="edit-ok" class="btn primary">确定</button>
      <button id="edit-cancel" class="btn">取消</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
