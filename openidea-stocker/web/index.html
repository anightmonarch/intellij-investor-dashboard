<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Title bar: "Stocker" + market tabs + close (matches the IntelliJ tool window content tabs) -->
  <div id="titlebar" class="titlebar">
    <div class="tw-title"><span class="tw-icon"></span><span>Stocker</span></div>
    <div id="tabs" class="tabs">
      <button class="tab active" data-market="all">ALL</button>
      <button class="tab" data-market="cn">CN</button>
      <button class="tab" data-market="hk">HK</button>
      <button class="tab" data-market="us">US</button>
      <button class="tab" data-market="crypto">Crypto</button>
    </div>
    <button id="btn-close" class="tw-close" title="隐藏">&#10005;</button>
  </div>

  <!-- Toolbar: left actions + right settings, like StockerSimpleToolWindow -->
  <div id="toolbar" class="toolbar">
    <div class="toolbar-left">
      <button id="btn-add" class="tb-btn" title="添加自选" aria-label="添加自选">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-refresh" class="tb-btn" title="刷新行情" aria-label="刷新行情">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.7-3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.3 2.5v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-stop" class="tb-btn stop" title="停止刷新" aria-label="停止刷新">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4.3" y="4.3" width="7.4" height="7.4" rx="1.2" fill="currentColor"/></svg>
      </button>
      <button id="btn-manage" class="tb-btn" title="管理自选" aria-label="管理自选">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M11.3 2.6l2.1 2.1-7.6 7.6-2.9.8.8-2.9z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="toolbar-right">
      <span id="bridge-badge" class="bridge-badge" title="连接状态">&#9675;</span>
      <button id="btn-settings" class="tb-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v1.7M8 13.3V15M1 8h1.7M13.3 8H15M3.1 3.1l1.2 1.2M11.7 11.7l1.2 1.2M12.9 3.1l-1.2 1.2M4.3 11.7l-1.2 1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Table -->
  <div id="table-wrap" class="table-wrap">
    <table id="quotes">
      <thead><tr id="head-row"></tr></thead>
      <tbody id="body-row"></tbody>
    </table>
    <div id="empty" class="empty">暂无自选，点击 + 添加自选代码</div>
  </div>

  <!-- Index bar: one selected index + value + change + percent -->
  <div id="index-bar" class="index-bar">
    <select id="index-select" class="index-select"></select>
    <span id="idx-value" class="idx-cell"></span>
    <span id="idx-extent" class="idx-cell"></span>
    <span id="idx-percent" class="idx-cell"></span>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-menu" class="ctx-menu hidden"><div id="ctx-delete" class="ctx-item">删除</div></div>

<!-- Add Favorites dialog -->
<div id="search-dialog" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">添加自选</div>
    <div class="search-top">
      <div class="mode-row"><label>搜索类型：</label>
        <select id="search-mode">
          <option value="stocks">股票（A股/港股/美股）</option>
          <option value="crypto">加密货币</option>
        </select>
      </div>
      <div class="search-field">
        <span class="search-icon">&#128269;</span>
        <input id="search-input" type="text" placeholder="输入以搜索股票（A股/港股/美股）" autocomplete="off">
        <button id="search-clear" class="search-clear hidden" title="清除">&#10005;</button>
      </div>
      <div class="search-header">
        <span class="col-code">代码</span><span class="col-market">市场</span>
        <span class="col-name">名称</span><span class="col-action">操作</span>
      </div>
    </div>
    <div id="search-results" class="search-results"></div>
    <div class="modal-footer"><button id="search-close" class="btn">Close</button></div>
  </div>
</div>

<!-- Manage Favorites dialog -->
<div id="manage-dialog" class="modal hidden">
  <div class="modal-box large">
    <div class="modal-title">管理自选</div>
    <div id="manage-tabs" class="manage-tabs">
      <button class="mtab active" data-market="cn">CN</button>
      <button class="mtab" data-market="hk">HK</button>
      <button class="mtab" data-market="us">US</button>
      <button class="mtab" data-market="crypto">Crypto</button>
    </div>
    <div class="manage-header">
      <span class="m-code">代码</span><span class="m-name">原始名称</span>
      <span class="m-custom">自定义名称</span><span class="m-cost">成本</span>
      <span class="m-hold">持仓</span><span class="m-ops"></span>
    </div>
    <div class="manage-toolbar">
      <button id="mt-edit" class="mt-btn" title="编辑自选" aria-label="编辑自选">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M11.3 2.6l2.1 2.1-7.6 7.6-2.9.8.8-2.9z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <button id="mt-up" class="mt-btn" title="上移" aria-label="上移">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 12.6V3.8M4.2 7.4L8 3.4l3.8 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="mt-down" class="mt-btn" title="下移" aria-label="下移">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.4v8.8M4.2 8.6L8 12.6l3.8-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="mt-delete" class="mt-btn danger" title="删除自选" aria-label="删除自选">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="manage-list" class="manage-list"></div>
    <div class="modal-footer">
      <button id="manage-ok" class="btn primary">OK</button>
      <button id="manage-cancel" class="btn">Cancel</button>
    </div>
  </div>
</div>

<!-- Edit dialog -->
<div id="edit-dialog" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-title" id="edit-title">编辑</div>
    <div class="edit-fields">
      <label>自定义名称：<input id="edit-name" type="text"></label>
      <label>成本价：<input id="edit-cost" type="text"></label>
      <label>持仓：<input id="edit-holdings" type="text"></label>
      <div id="edit-error" class="field-error"></div>
    </div>
    <div class="modal-footer">
      <button id="edit-ok" class="btn primary">确定</button>
      <button id="edit-cancel" class="btn">取消</button>
    </div>
  </div>
</div>

<!-- Settings dialog: 1:1 replica of the original Stocker settings page -->
<div id="settings-dialog" class="modal hidden">
  <div class="settings-shell">
    <div class="settings-head">
      <span class="settings-crumb">Tools › Stocker</span>
      <span class="settings-hint">插件的设置；项目可以覆盖。</span>
    </div>
    <div class="settings-body">
      <!-- 通用 -->
      <section class="set-group">
        <h3 class="set-group-title">通用</h3>
        <div class="set-row">
          <label class="set-label" for="set-language">语言：</label>
          <div class="set-control">
            <select id="set-language" class="set-select">
              <option value="">跟随系统语言</option>
              <option value="en">英语</option>
              <option value="zh_CN">简体中文</option>
            </select>
            <p class="set-comment">更改后立即应用到表格视图</p>
          </div>
        </div>
      </section>

      <!-- 数据提供商 -->
      <section class="set-group">
        <h3 class="set-group-title">数据提供商</h3>
        <div class="set-row">
          <label class="set-label" for="set-provider">股票行情源：</label>
          <div class="set-control">
            <select id="set-provider" class="set-select">
              <option value="sina">新浪</option>
              <option value="tencent">腾讯</option>
            </select>
            <p class="set-comment">选择股票行情的数据源（A股、港股、美股）</p>
          </div>
        </div>
        <div class="set-row">
          <label class="set-label" for="set-crypto-provider">加密货币行情源：</label>
          <div class="set-control">
            <select id="set-crypto-provider" class="set-select" disabled>
              <option value="sina">新浪</option>
            </select>
            <p class="set-comment">加密货币行情仅支持新浪数据源</p>
          </div>
        </div>
      </section>

      <!-- 表格显示 -->
      <section class="set-group">
        <h3 class="set-group-title">表格显示</h3>
        <div class="set-row">
          <span class="set-label">颜色模式：</span>
          <div class="set-control">
            <label class="set-radio"><input type="radio" name="colorPattern" value="rugd"><span>红涨绿跌</span>
              <p class="set-comment">传统亚洲市场配色方案</p></label>
            <label class="set-radio"><input type="radio" name="colorPattern" value="gurd"><span>绿涨红跌</span>
              <p class="set-comment">西方市场配色方案</p></label>
            <label class="set-radio"><input type="radio" name="colorPattern" value="none"><span>无颜色编码</span>
              <p class="set-comment">所有数值使用默认文本颜色显示</p></label>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">名称格式：</span>
          <div class="set-control">
            <label class="set-check"><input type="checkbox" id="set-pinyin"><span>将中文名称转换为拼音</span></label>
            <p class="set-comment">示例：平安银行 -> PingAnYinHang</p>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">可见列：</span>
          <div class="set-control set-columns" id="set-columns"></div>
        </div>
        <p id="set-columns-warning" class="set-warning hidden">请至少保留一列可见列。</p>
      </section>
    </div>
    <div class="modal-footer settings-footer">
      <button id="settings-cancel" class="btn">取消</button>
      <button id="settings-apply" class="btn">应用</button>
      <button id="settings-ok" class="btn primary">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
